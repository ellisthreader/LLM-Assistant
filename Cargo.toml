[package]
name = "desk-assistant"
version = "0.1.0"
edition = "2021"
description = "Wake-word voice assistant for Raspberry Pi with touchscreen UI"

[dependencies]
eframe = "0.29"
egui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
crossbeam-channel = "0.5"
cpal = "0.15"
rodio = "0.19"
hound = "3.5"
rustpotter = "3.0"
chrono = "0.4"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
# Not used directly: pins a version compatible with rustpotter's candle-core 0.2,
# which fails to compile against half >= 2.4 (rand version conflict).
half = "=2.3.1"

[profile.release]
opt-level = 3
lto = "thin"

# Keep build artifacts small (no debug info) — matters on small disks / the Pi.
[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0
opt-level = 1
